<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inventory</title>
<style>
:root{--bg:#eef1f0;--panel:#fff;--ink:#17211f;--mute:#5f6e6a;--line:#d5dcd9;--acc:#0f766e;--accfg:#fff;--danger:#b42318;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--panel:#1b2421;--ink:#e8efed;--mute:#97a8a3;--line:#2c3935;--acc:#2dd4bf;--accfg:#06201c;--danger:#f97066}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(130px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
h1{font-size:22px;margin:0 auto 0 0;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.dng{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;width:100%}
.bar{padding:6px 16px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 11px;font-size:14px;border:2px solid transparent;cursor:pointer;user-select:none}
.chip.off{background:transparent!important;color:var(--ink)!important;border-color:currentColor;opacity:.55}
.chip.sm{padding:2px 9px;font-size:12px;cursor:default}
.count{color:var(--mute);font-size:14px;padding:4px 16px}
.list{padding:8px 16px;display:grid;gap:10px}
.item{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;align-items:center}
.thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--line);flex:none;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center}
.item h3{margin:0 0 2px;font-size:17px}
.item .cat{color:var(--mute);font-size:13px;margin-bottom:5px}
.empty{color:var(--mute);text-align:center;padding:48px 24px}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:84px;padding:24px;font-size:28px;font-weight:700;border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.ov[hidden]{display:none}
.card{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.card label{font-size:13px;color:var(--mute);margin-bottom:-4px}
.row{display:flex;gap:8px;align-items:center}
.row>button{flex:none}
.pv{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:var(--line);min-height:70px;cursor:pointer}
input[type=color]{width:52px;height:44px;padding:3px;flex:none}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.hint{color:var(--mute);font-size:13px}
.info{flex:1;min-width:0}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.stp button{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.stp span{min-width:26px;text-align:center;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Inventory</h1>
  <button id="bManage">Manage</button>
  <button id="bExport">Save</button>
  <button id="bImport">Import</button>
</header>

<div class="bar">
  <select id="fCat" aria-label="Filter by category"></select>
  <div class="chips" id="fTags"></div>
</div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>

<button class="fab pri" id="bAdd">Add item</button>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="imp" accept="application/json,.json,application/zip,.zip" hidden>
<input type="file" id="imf" accept="image/*" webkitdirectory multiple hidden>

<div class="ov" id="sheet" hidden>
  <div class="card">
    <img class="pv" id="pv" alt="Item photo. Tap to retake.">
    <div class="hint" id="pvh">Tap the photo to retake it.</div>
    <label for="nm">Name</label>
    <input id="nm" placeholder="e.g. Winter Jacket" autocomplete="off" autocapitalize="words" enterkeyhint="done">
    <label for="qn">Quantity</label>
    <div class="row"><button id="qm" aria-label="Decrease">&minus;</button><input id="qn" type="number" inputmode="numeric" min="0" value="1" style="text-align:center;width:90px"><button id="qp" aria-label="Increase">+</button></div>
    <label for="cs">Category</label>
    <div class="row"><select id="cs"></select><button id="ncat">New</button></div>
    <label>Tags</label>
    <div class="chips" id="tg"></div>
    <div class="row">
      <input id="tn" placeholder="New tag name" autocomplete="off">
      <input type="color" id="tc" value="#2563eb" aria-label="Tag color">
      <button id="ta">Add tag</button>
    </div>
    <div class="row">
      <button class="dng" id="del">Delete</button>
      <button id="cancel" style="margin-left:auto">Cancel</button>
      <button class="pri" id="ok">Save</button>
    </div>
  </div>
</div>

<div class="ov" id="imv" hidden>
  <div class="card">
    <strong>Import</strong>
    <div class="hint">Choose the saved .zip file and you are done. Or choose the JSON file plus the folder of pictures (matched by item id).</div>
    <button id="pj">1. Choose zip or JSON file</button><div class="hint" id="pjn"></div>
    <button id="pf">2. Pictures folder (not needed for a zip)</button><div class="hint" id="pfn"></div>
    <div class="row"><button id="icancel" style="margin-left:auto">Cancel</button><button class="pri" id="igo">Import</button></div>
  </div>
</div>

<div class="ov" id="manage" hidden>
  <div class="card">
    <strong>Categories</strong>
    <div id="mCats"></div>
    <div class="row"><input id="mcn" placeholder="New category"><button id="mca">Add</button></div>
    <strong>Tags</strong>
    <div id="mTags"></div>
    <button class="pri" id="mClose">Done</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
let S={categories:[],tags:[],items:[]};
try{const d=JSON.parse(localStorage.getItem('inv')||'null');if(d)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem('inv',JSON.stringify(S))}catch(e){alert('Could not save data on this device.')}};
const IMG={};           // id -> dataURL (kept out of the JSON export)
let db=null,F={cat:'',tags:[]},D=null,camMode='new';

/* ---------- image storage (IndexedDB, this device only) ---------- */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('inv_img',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const imgPut=(k,v)=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('i','readwrite');t.objectStore('i').put(v,k);t.oncomplete=t.onerror=()=>r()}catch(e){r()}});
const imgDel=k=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('i','readwrite');t.objectStore('i').delete(k);t.oncomplete=t.onerror=()=>r()}catch(e){r()}});
const imgAll=()=>new Promise(r=>{if(!db)return r();try{const q=db.transaction('i').objectStore('i').openCursor();q.onsuccess=()=>{const c=q.result;if(c){IMG[c.key]=c.value;c.continue()}else r()};q.onerror=()=>r()}catch(e){r()}});
function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const s=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};i.onerror=()=>res(null);i.src=u})}

/* ---------- helpers ---------- */
const tagById=id=>S.tags.find(t=>t.id===id);
const catById=id=>S.categories.find(c=>c.id===id);
function fg(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (.299*r+.587*g+.114*b)>150?'#111':'#fff'}
const cap=s=>s.replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
const chip=(t,extra='',off=false)=>`<span class="chip ${extra}${off?' off':''}" data-id="${t.id}" style="background:${t.color};color:${fg(t.color)}">${esc(t.name)}</span>`;

/* ---------- main list ---------- */
function render(){
  const fc=$('#fCat');
  fc.innerHTML='<option value="">All categories</option>'+S.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'<option value="_none">Uncategorized</option>';
  if(F.cat&&F.cat!=='_none'&&!catById(F.cat))F.cat='';
  fc.value=F.cat;
  F.tags=F.tags.filter(id=>tagById(id));
  $('#fTags').innerHTML=S.tags.map(t=>chip(t,'',!F.tags.includes(t.id)&&F.tags.length>0)).join('');
  const items=S.items.filter(i=>(!F.cat||(F.cat==='_none'?!i.cat||!catById(i.cat):i.cat===F.cat))&&F.tags.every(t=>i.tags.includes(t)))
    .sort((a,b)=>(b.created||0)-(a.created||0));
  $('#count').textContent=items.length+' of '+S.items.length+' items';
  $('#list').innerHTML=items.length?items.map(i=>`<div class="item" data-id="${i.id}">
    ${IMG[i.id]?`<img class="thumb" src="${IMG[i.id]}" alt="">`:'<div class="thumb">No photo</div>'}
    <div class="info"><h3>${esc(i.name)}</h3><div class="cat">${catById(i.cat)?esc(catById(i.cat).name):'Uncategorized'}</div>
    <div class="chips">${i.tags.map(tagById).filter(Boolean).map(t=>chip(t,'sm')).join('')}</div></div>
    <div class="stp"><button data-d="-1" data-i="${i.id}" aria-label="Decrease quantity">&minus;</button><span>${i.qty??1}</span><button data-d="1" data-i="${i.id}" aria-label="Increase quantity">+</button></div></div>`).join('')
    :`<div class="empty">${S.items.length?'No items match these filters.':'Nothing here yet. Tap Add item and take a photo.'}</div>`;
}
$('#fCat').onchange=e=>{F.cat=e.target.value;render()};
$('#fTags').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const id=c.dataset.id;F.tags=F.tags.includes(id)?F.tags.filter(x=>x!==id):[...F.tags,id];render()};
$('#list').onclick=e=>{
  const b=e.target.closest('[data-d]');
  if(b){const it=S.items.find(i=>i.id===b.dataset.i);if(it){it.qty=Math.max(0,(it.qty??1)+Number(b.dataset.d));save();render()}return}
  const el=e.target.closest('.item');if(el)openSheet(S.items.find(i=>i.id===el.dataset.id))};

/* ---------- add / edit sheet ---------- */
function pickFile(){$('#cam').value='';$('#cam').click()}
// Add item: open the naming sheet first (a real tap, so iOS opens the keyboard)
$('#bAdd').onclick=()=>openSheet(null);
$('#pv').onclick=()=>{camMode='retake';pickFile()};
$('#cam').onchange=async e=>{
  const f=e.target.files[0];if(!f||!D)return;
  const img=await shrink(f);
  if(!img){alert('That photo could not be read. Try again.');return}
  D.img=img;
  if(camMode==='new')await commit();else $('#pv').src=img;
};
function openSheet(item){
  D=item?{id:item.id,name:item.name,cat:item.cat||'',tags:[...item.tags],qty:item.qty??1,img:IMG[item.id]||null,isNew:false}
        :{id:uid(),name:'',cat:F.cat&&F.cat!=='_none'?F.cat:'',tags:[...F.tags],qty:1,img:null,isNew:true};
  $('#nm').value=D.name;$('#qn').value=D.qty;$('#pv').src=D.img||'';$('#del').style.visibility=item?'visible':'hidden';$('#pv').style.display=$('#pvh').style.display=D.img?'':'none';$('#ok').textContent=item?'Save':'Take photo';
  fillCats();fillTags();$('#sheet').hidden=false;
  if(!item){$('#nm').focus();setTimeout(()=>$('#nm').focus(),60)}
}
function fillCats(){$('#cs').innerHTML='<option value="">Uncategorized</option>'+S.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('#cs').value=D.cat}
function fillTags(){$('#tg').innerHTML=S.tags.length?S.tags.map(t=>chip(t,'',!D.tags.includes(t.id))).join(''):'<span class="hint">No tags yet. Create one below.</span>'}
$('#cs').onchange=e=>D.cat=e.target.value;
const qSet=n=>{$('#qn').value=Math.max(0,n)};
$('#qm').onclick=()=>qSet((parseInt($('#qn').value)||0)-1);
$('#qp').onclick=()=>qSet((parseInt($('#qn').value)||0)+1);
$('#tg').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const id=c.dataset.id;D.tags=D.tags.includes(id)?D.tags.filter(x=>x!==id):[...D.tags,id];fillTags()};
$('#ncat').onclick=()=>{const n=(prompt('New category name')||'').trim();if(!n)return;const c={id:uid(),name:n};S.categories.push(c);D.cat=c.id;fillCats();save()};
$('#ta').onclick=()=>{
  const n=$('#tn').value.trim();if(!n)return;
  let t=S.tags.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(!t){t={id:uid(),name:n,color:$('#tc').value};S.tags.push(t);save()}
  if(!D.tags.includes(t.id))D.tags.push(t.id);
  $('#tn').value='';fillTags();
};
$('#nm').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(!$('#nm').value.trim())return;
  $('#nm').blur();$('#ok').click();
});
$('#cancel').onclick=()=>{$('#sheet').hidden=true;D=null};
async function commit(){
  const name=cap($('#nm').value.trim());
  if(!name){$('#nm').focus();return}
  let it=S.items.find(i=>i.id===D.id);
  if(!it){it={id:D.id,created:Date.now()};S.items.push(it)}
  let q=parseInt($('#qn').value);if(isNaN(q)||q<0)q=1;
  Object.assign(it,{name,cat:D.cat,tags:D.tags,qty:q});
  if(D.img&&IMG[it.id]!==D.img){IMG[it.id]=D.img;await imgPut(it.id,D.img)}
  save();$('#sheet').hidden=true;D=null;render();
}
// new item: opening the camera must happen directly inside the tap/Enter, so it is not awaited
$('#ok').onclick=()=>{
  if(!$('#nm').value.trim()){$('#nm').focus();return}
  if(D.isNew){camMode='new';pickFile()}else commit();
};
$('#del').onclick=async()=>{
  if(!confirm('Delete this item?'))return;
  S.items=S.items.filter(i=>i.id!==D.id);delete IMG[D.id];await imgDel(D.id);
  save();$('#sheet').hidden=true;D=null;render();
};

/* ---------- manage categories & tags ---------- */
function renderManage(){
  $('#mCats').innerHTML=S.categories.map(c=>`<div class="mrow"><span>${esc(c.name)}</span><button class="dng" data-c="${c.id}">Delete</button></div>`).join('')||'<div class="hint">No categories yet.</div>';
  $('#mTags').innerHTML=S.tags.map(t=>`<div class="mrow">${chip(t,'sm')}<button class="dng" data-t="${t.id}">Delete</button></div>`).join('')||'<div class="hint">No tags yet. Create them when adding an item.</div>';
}
$('#bManage').onclick=()=>{renderManage();$('#manage').hidden=false};
$('#mClose').onclick=()=>{$('#manage').hidden=true;render()};
$('#mca').onclick=()=>{const n=$('#mcn').value.trim();if(!n)return;S.categories.push({id:uid(),name:n});$('#mcn').value='';save();renderManage()};
$('#manage').onclick=e=>{
  const c=e.target.dataset.c,t=e.target.dataset.t;
  if(c&&confirm('Delete this category? Its items become uncategorized.')){S.categories=S.categories.filter(x=>x.id!==c);S.items.forEach(i=>{if(i.cat===c)i.cat=''});save();renderManage()}
  if(t&&confirm('Delete this tag? It is removed from all items.')){S.tags=S.tags.filter(x=>x.id!==t);S.items.forEach(i=>i.tags=i.tags.filter(x=>x!==t));save();renderManage()}
};

/* ---------- Save (zip: inventory.json + pictures/<id>.jpg) ---------- */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+sz;
  }
  let cs=0;cen.forEach(x=>cs+=x.length);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
}
const dataBytes=u=>{const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
async function saveAll(){
  const items=S.items.map(i=>IMG[i.id]?{...i,image:'pictures/'+i.id+'.jpg'}:{...i});
  const data={version:2,exported:new Date().toISOString(),categories:S.categories,tags:S.tags,items};
  const files=[{name:'inventory.json',data:new TextEncoder().encode(JSON.stringify(data,null,2))}];
  S.items.forEach(i=>{if(IMG[i.id])files.push({name:'pictures/'+i.id+'.jpg',data:dataBytes(IMG[i.id])})});
  const blob=makeZip(files),name='inventory-'+new Date().toISOString().slice(0,10)+'.zip';
  if(window.showSaveFilePicker){
    try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Zip file',accept:{'application/zip':['.zip']}}]});const w=await h.createWritable();await w.write(blob);await w.close();return}
    catch(e){if(e.name==='AbortError')return}
  }
  const file=new File([blob],name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
$('#bExport').onclick=saveAll;

/* ---------- Import (JSON file + pictures folder) ---------- */
let impJson=null,impFiles=[];
$('#bImport').onclick=()=>{impJson=null;impFiles=[];$('#pjn').textContent='No file chosen';$('#pfn').textContent='No folder chosen (pictures will be skipped)';$('#imv').hidden=false};
$('#pj').onclick=()=>{$('#imp').value='';$('#imp').click()};
$('#pf').onclick=()=>{$('#imf').value='';$('#imf').click()};
async function readZip(file){
  const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('not a zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+xl+cl;
    if(name.endsWith('/')||name.startsWith('__MACOSX')||name.split('/').pop().startsWith('.'))continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    let data=u8.subarray(ds,ds+csz);
    if(method===8)data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if(method!==0)continue;
    out.push({name,data});
  }
  return out;
}
$('#imp').onchange=e=>{impJson=e.target.files[0]||null;$('#pjn').textContent=impJson?impJson.name:'No file chosen'};
$('#imf').onchange=e=>{impFiles=[...e.target.files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name));$('#pfn').textContent=impFiles.length+' pictures found'};
$('#icancel').onclick=()=>{$('#imv').hidden=true};
$('#igo').onclick=async()=>{
  if(!impJson){alert('Choose the JSON file first.');return}
  let d,pics=impFiles;
  try{
    if(/\.zip$/i.test(impJson.name)||impJson.type==='application/zip'){
      const ent=await readZip(impJson);
      const j=ent.find(x=>/(^|\/)inventory\.json$/i.test(x.name))||ent.find(x=>/\.json$/i.test(x.name));
      if(!j){alert('No inventory.json found inside that zip.');return}
      d=JSON.parse(new TextDecoder().decode(j.data));
      const mt={png:'image/png',webp:'image/webp',heic:'image/heic'};
      pics=[...impFiles,...ent.filter(x=>/\.(jpe?g|png|webp|heic)$/i.test(x.name)).map(x=>new File([x.data],x.name,{type:mt[x.name.split('.').pop().toLowerCase()]||'image/jpeg'}))];
    }else d=JSON.parse(await impJson.text());
  }catch(err){alert('Could not read that file. Make sure it is the saved zip or a valid JSON.');return}
  if(!d||!Array.isArray(d.items)){alert('This file does not look like an inventory export.');return}
  const clean={categories:(d.categories||[]).filter(c=>c&&c.id&&c.name),tags:(d.tags||[]).filter(t=>t&&t.id&&t.name&&/^#[0-9a-f]{6}$/i.test(t.color)),
    items:d.items.filter(i=>i&&i.id&&i.name).map(i=>({id:String(i.id),name:String(i.name),cat:i.cat||'',tags:Array.isArray(i.tags)?i.tags:[],qty:Number.isFinite(+i.qty)&&+i.qty>=0?Math.floor(+i.qty):1,created:i.created||Date.now(),_img:i.image||''}))};
  if(confirm('Replace your current inventory with this file?\n\nOK = replace everything\nCancel = merge it into what you have')){S={categories:clean.categories,tags:clean.tags,items:clean.items.map(({_img,...r})=>r)}}
  else{
    for(const k of['categories','tags'])clean[k].forEach(x=>{const j=S[k].findIndex(y=>y.id===x.id);j<0?S[k].push(x):S[k][j]=x});
    clean.items.forEach(({_img,...x})=>{const j=S.items.findIndex(y=>y.id===x.id);j<0?S.items.push(x):S.items[j]=x});
  }
  const base=n=>n.split('/').pop().replace(/\.[^.]+$/,'');
  const byId={};pics.forEach(f=>{byId[base(f.name)]=f});
  let n=0;
  for(const it of clean.items){
    const f=byId[it.id]||(it._img&&byId[base(it._img)]);
    if(f){const img=await shrink(f);if(img){IMG[it.id]=img;await imgPut(it.id,img);n++}}
  }
  save();render();$('#imv').hidden=true;
  alert('Imported '+clean.items.length+' items and '+n+' pictures.');
};

/* ---------- start ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
openDB().then(imgAll).then(render);
render();
